services:
  mongodb:
    image: mongo:latest
    container_name: job-portal-db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: job-portal-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - FRONTEND_URL=http://localhost:5173
      - DB_URL=mongodb://mongodb:27017/jobportal
      - JWT_SECRET_KEY=dev_secret_key_12345
      - JWT_EXPIRE=7d
      - COOKIE_EXPIRE=7
      - CLOUDINARY_CLOUD_NAME=dummy_cloud
      - CLOUDINARY_API_KEY=123456789012345
      - CLOUDINARY_API_SECRET=dummy_secret
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: job-portal-frontend
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend